<!DOCTYPE html>
<!-- TESTES AUTOMÁTICOS das funções que, se erradas, gerariam número errado na tela.
     Como usar: abra este arquivo no navegador. Cada linha mostra OK ou FALHOU. -->
<html lang="pt-BR"><head><meta charset="utf-8"><title>Testes</title></head>
<body style="font-family:sans-serif"><h1>Testes</h1><ul id="saida"></ul>
<script src="../js/config.js"></script>
<script src="../js/utilitarios.js"></script>
<script src="../js/siglas.js"></script>
<script src="../js/fontes/despesas.js"></script>
<script src="../js/agregacao.js"></script>
<script src="../js/pessoal-regras.js"></script>
<script src="../js/contas-regras.js"></script>
<script src="../js/contratos-regras.js"></script>
<script src="../js/exportar.js"></script>
<script src="../js/transferencias-regras.js"></script>
<script src="../js/busca-regras.js"></script>
<script src="../js/historico.js"></script>
<script src="../js/frases.js"></script>
<script src="../js/ouvir.js"></script>
<script src="../js/compartilhar.js"></script>
<script src="../js/componentes/graficos.js"></script>
<script src="../js/componentes/blocos.js"></script>
<script src="../js/rotas.js"></script>
<script src="../js/pix-regras.js"></script>
<script src="../js/vendor/qrcodegen.js"></script>
<script>
  // Compara o resultado obtido com o esperado e escreve na página.
  function teste(nome, obtido, esperado) {
    const ok = JSON.stringify(obtido) === JSON.stringify(esperado);
    const li = document.createElement('li');
    li.textContent = (ok ? 'OK — ' : 'FALHOU — ') + nome + (ok ? '' : ` (obtido ${JSON.stringify(obtido)}, esperado ${JSON.stringify(esperado)})`);
    li.style.color = ok ? 'green' : 'red';
    document.getElementById('saida').append(li);
  }
  teste('numero converte texto', OBS.numero('2030.00'), 2030);
  teste('numero aceita "0"', OBS.numero('0'), 0);
  teste('numero rejeita texto inválido', OBS.numero('abc'), null);
  teste('CPF é mascarado', OBS.tratarDocumento('123.456.789-01').texto, '***.456.789-**');
  teste('CNPJ aparece formatado', OBS.tratarDocumento('12345678000190').texto, '12.345.678/0001-90');
  teste('documento vazio', OBS.tratarDocumento('').tipo, 'Documento não informado');
  teste('período de setembro/2026', OBS.periodoDoMes('2026-09').ini + ' a ' + OBS.periodoDoMes('2026-09').fim, '01/09/2026 a 30/09/2026');
  teste('fevereiro de ano bissexto', OBS.periodoDoMes('2028-02').fim, '29/02/2028');
  const r = OBS.agregar([
    { nomeCredor: 'A', cpfCnpjCredor: '12345678000190', orgaoDescricao: 'X', valorEmpenhado: '100', valorLiquidado: '80', valorPago: '50' },
    { nomeCredor: 'A', cpfCnpjCredor: '12.345.678/0001-90', orgaoDescricao: 'Y', valorEmpenhado: '10', valorLiquidado: '10', valorPago: '10' }
  ]);
  teste('junta o mesmo credor pelo documento', r.credores.length, 1);
  teste('soma o pago do credor', r.credores[0].pago, 60);
  teste('total pago', r.total.pago, 60);
  teste('soma por secretaria (X=50, Y=10)', r.orgaos.map((o) => [o.nome, o.pago]), [['X', 50], ['Y', 10]]);
  teste('credor sabe quem pagou', OBS.ordenar(r.credores[0].porOrgao), [['X', 50], ['Y', 10]]);
  teste('secretaria sabe a quem pagou', r.orgaos[0].porCredor.get('12345678000190'), 50);
  teste('origem não informada', r.fontes, [['(origem não informada)', 60]]);
  const r2 = OBS.agregar([{ nomeCredor: 'B', cpfCnpjCredor: '', orgaoDescricao: 'X', valorEmpenhado: '100', valorAnulado: '20', valorLiquidado: '80', valorRetido: '5', valorPago: '75' }]);
  // Mesmo CNPJ com nomes diferentes (caso real: instituto de previdência e a folha dos aposentados): nenhum nome some.
  const r3 = OBS.agregar([
    { nomeCredor: 'INSTITUTO', cpfCnpjCredor: '05002371000126', orgaoDescricao: 'X', valorEmpenhado: '10', valorLiquidado: '10', valorPago: '10' },
    { nomeCredor: 'FOLHA APOSENTADOS', cpfCnpjCredor: '05.002.371/0001-26', orgaoDescricao: 'Y', valorEmpenhado: '30', valorLiquidado: '30', valorPago: '30' },
    { nomeCredor: 'SÓ EMPENHO', cpfCnpjCredor: '11222333000144', orgaoDescricao: 'X', valorEmpenhado: '99', valorLiquidado: '0', valorPago: '0' },
    { nomeCredor: 'ESTORNO', cpfCnpjCredor: '99888777000166', orgaoDescricao: 'X', valorEmpenhado: '-5', valorLiquidado: '-5', valorPago: '-5' }
  ]);
  teste('mesmo CNPJ: nome exibido é o de maior valor pago', r3.credores[0].nome, 'FOLHA APOSENTADOS');
  teste('mesmo CNPJ: os outros nomes ficam guardados', r3.credores[0].outrosNomes, ['INSTITUTO']);
  teste('"credores que receberam" não conta quem só teve empenho ou estorno', [r3.credores.length, r3.credoresQueReceberam], [3, 1]);
  teste('total anulado', r2.total.anulado, 20);
  teste('total retido', r2.total.retido, 5);
  const v = OBS.fontes.despesas.validar([{ valorEmpenhado: '1', valorLiquidado: '1', valorPago: '1' }, { valorEmpenhado: '1', valorLiquidado: '1', valorPago: 'x' }]);
  teste('validar separa linha inválida', [v.validas.length, v.descartadas.length], [1, 1]);
  // ----- Lista de servidores (aba Servidores) -----
  const L = OBS.pessoal.preparar([
    { nome: 'JOÃO EXEMPLO', cargo: 'PROFESSOR', lotacao: 'SECRETARIA MUNICIPAL DE EDUCACAO', vinculo: 'Estatutário', salario: 4000 },
    { nome: 'ANA MODELO', cargo: 'ASSESSOR DE GABINETE', lotacao: 'GABINETE DO PREFEITO', vinculo: 'Cargo Comissionado', salario: 6000 },
    { nome: 'BIA TESTE', cargo: 'DIRETOR', lotacao: 'GABINETE DO PREFEITO', vinculo: 'Cargo Comissionado', salario: 9000 },
    { nome: 'CAIO TESTE', cargo: 'SECRETARIO ESCOLAR', lotacao: 'ESCOLA', vinculo: 'Estatutário', salario: null },
    { nome: 'DORA TESTE', cargo: 'SECRETÁRIO MUNICIPAL DE SAÚDE', lotacao: 'SAUDE', vinculo: 'Cargo Comissionado', salario: 16000 }
  ]);
  teste('normalizar tira acento e espaços', OBS.pessoal.normalizar(' JOÃO Ç '), 'joao c');
  teste('busca sem acento acha JOÃO', OBS.pessoal.buscar(L, { termo: 'joao' }).map((s) => s.nome), ['JOÃO EXEMPLO']);
  teste('busca com duas palavras em qualquer ordem', OBS.pessoal.buscar(L, { termo: 'gabinete ana' }).map((s) => s.nome), ['ANA MODELO']);
  teste('filtro por vínculo', OBS.pessoal.buscar(L, { vinculo: 'Cargo Comissionado' }).length, 3);
  teste('ordem por salário: sem salário vai para o fim', OBS.pessoal.buscar(L, { ordem: 'salario' }).map((s) => s.nome)[4], 'CAIO TESTE');
  teste('soma ignora salário não informado', OBS.pessoal.somaSalarios(L), 35000);
  teste('secretário municipal é político', OBS.pessoal.ehCargoPolitico(L[4]), true);
  teste('secretário escolar NÃO é político', OBS.pessoal.ehCargoPolitico(L[3]), false);
  teste('"prefeitura" NÃO é prefeito', OBS.pessoal.ehCargoPolitico({ cargo: 'AGENTE DA PREFEITURA' }), false);
  teste('vice-prefeito é político', OBS.pessoal.ehCargoPolitico({ cargo: 'VICE-PREFEITO' }), true);
  const C = OBS.pessoal.comissionadosPorSetor(L);
  teste('comissionados: setor de maior soma primeiro', C.map((g) => [g.nome, g.pessoas.length, g.soma]), [['SAUDE', 1, 16000], ['GABINETE DO PREFEITO', 2, 15000]]);
  teste('comissionados: maior salário primeiro no setor', C[1].pessoas.map((s) => s.nome), ['BIA TESTE', 'ANA MODELO']);
  teste('explica o vínculo comissionado', OBS.pessoal.explicarVinculo('Cargo Comissionado').curto, 'Indicação (comissionado)');
  teste('vínculo desconhecido fica sem explicação', OBS.pessoal.explicarVinculo('Outro vínculo'), null);
  teste('filtro por setor combinado com vínculo', OBS.pessoal.buscar(L, { setor: 'GABINETE DO PREFEITO', vinculo: 'Cargo Comissionado' }).length, 2);
  teste('busca sem filtros devolve todos', OBS.pessoal.buscar(L, {}).length, 5);
  // ----- Casos extremos e dados incompletos -----
  const vazio = OBS.agregar([]);
  teste('lista vazia: totais zerados', [vazio.total.pago, vazio.credores.length, vazio.orgaos.length], [0, 0, 0]);
  const incompleto = OBS.agregar([{ valorEmpenhado: '10', valorLiquidado: '5', valorPago: '5' }]);
  teste('linha sem nomes: rótulos padrão', [incompleto.orgaos[0].nome, incompleto.credores[0].nome, incompleto.fontes[0][0]],
    ['(órgão não informado)', '(sem nome)', '(origem não informada)']);
  const negativo = OBS.agregar([{ nomeCredor: 'X', orgaoDescricao: 'A', valorEmpenhado: '-100', valorLiquidado: '0', valorPago: '-50' }]);
  teste('valor negativo (estorno) entra na soma como veio', negativo.total.pago, -50);
  teste('valor muito grande sem perder centavos', OBS.agregar([{ valorEmpenhado: '987654321.99', valorLiquidado: '0', valorPago: '987654321.99' }]).total.pago, 987654321.99);
  teste('mês anterior em 31/03 é fevereiro', OBS.mesAnterior(new Date(2026, 2, 31)), '2026-02');
  teste('mês anterior em janeiro é dezembro do ano anterior', OBS.mesAnterior(new Date(2026, 0, 15)), '2025-12');
  // ----- Planilha CSV -----
  teste('CSV: aspas dobradas', OBS.exportar.celula('a "b"'), '"a ""b"""');
  teste('CSV: bloqueia fórmula (=)', OBS.exportar.celula('=SOMA(A1)'), "\"'=SOMA(A1)\"");
  teste('CSV: bloqueia fórmula (+ e @)', [OBS.exportar.celula('+1'), OBS.exportar.celula('@x')], ["\"'+1\"", "\"'@x\""]);
  teste('CSV: número com vírgula', OBS.exportar.numero(1234.5), '1234,50');
  teste('CSV: valor inválido fica vazio', OBS.exportar.numero(null), '');
  const csv = OBS.exportar.csvDespesas([{ orgaoDescricao: 'SAUDE', unidadeDescricao: 'U', fonteRecursoDescricao: 'F', nomeCredor: 'FULANO', cpfCnpjCredor: '12345678901',
    valorEmpenhado: '10', valorAnulado: '0', valorLiquidado: '10', valorRetido: '0', valorPago: '10' }],
    { ini: '01/09/2026', fim: '30/09/2026' }, { url: 'https://exemplo', consultadoEm: new Date(2026, 9, 1), descartadas: 0 });
  teste('CSV: tem fonte e período no topo', csv.includes('"Período";"01/09/2026 a 30/09/2026"'), true);
  teste('CSV: CPF sai mascarado', [csv.includes('12345678901'), csv.includes('***.456.789-**')], [false, true]);
  // ----- Contas e limites (LRF) -----
  const lim = { limiteAlertaPct: 48.6, limitePrudencialPct: 51.3, limiteMaximoPct: 54 };
  teste('LRF: 41,78% está abaixo do alerta', OBS.contas.faixa(Object.assign({ dtpPct: 41.78 }, lim)).nivel, 0);
  teste('LRF: 49% está acima do alerta', OBS.contas.faixa(Object.assign({ dtpPct: 49 }, lim)).nivel, 1);
  teste('LRF: 52% está acima do prudencial', OBS.contas.faixa(Object.assign({ dtpPct: 52 }, lim)).nivel, 2);
  teste('LRF: exatamente 54% conta como acima do máximo', OBS.contas.faixa(Object.assign({ dtpPct: 54 }, lim)).nivel, 3);
  teste('LRF: sem números, sem faixa', OBS.contas.faixa({ dtpPct: null }), null);
  teste('LRF: período mais recente', OBS.contas.maisRecente([{ ano: 2025, periodo: 3 }, { ano: 2026, periodo: 1 }, { ano: 2025, periodo: 1 }]), { ano: 2026, periodo: 1 });
  teste('LRF: percentual em português', OBS.contas.pct(41.78), '41,78%');
  // ----- Contratos e licitações -----
  const K = OBS.contratos.preparar([
    { fornecedor: 'ÁGUA LIMPA LTDA', fornecedorDoc: '11.222.333/0001-44', objeto: 'Limpeza', orgao: 'MUNICIPIO', valorGlobal: 100, dataAssinatura: '2026-01-10' },
    { fornecedor: 'ÁGUA LIMPA LTDA', fornecedorDoc: '11.222.333/0001-44', objeto: 'Limpeza 2', orgao: 'FUNDO', valorGlobal: 300, dataAssinatura: '2026-03-10' },
    { fornecedor: 'BETA SA', fornecedorDoc: '99.888.777/0001-66', objeto: 'Obra', orgao: 'MUNICIPIO', valorGlobal: 250, dataAssinatura: '2025-12-01' },
    { fornecedor: 'SEM VALOR', objeto: 'X', orgao: 'MUNICIPIO', valorGlobal: null, dataAssinatura: null }
  ], ['fornecedor', 'objeto', 'orgao']);
  teste('contratos: busca sem acento', OBS.contratos.buscar(K, { termo: 'agua' }, 'valorGlobal', 'dataAssinatura').length, 2);
  teste('contratos: mais recentes primeiro', OBS.contratos.buscar(K, {}, 'valorGlobal', 'dataAssinatura').map((c) => c.objeto)[0], 'Limpeza 2');
  teste('contratos: maior valor primeiro, sem valor no fim', OBS.contratos.buscar(K, { ordem: 'valor' }, 'valorGlobal', 'dataAssinatura').map((c) => c.valorGlobal), [300, 250, 100, null]);
  teste('contratos: consórcio intermunicipal não é órgão do município',
    ['CONSORCIO PUBLICO INTERFEDERATIVO DE SAUDE - CISAMARP', 'Consórcio X', 'MUNICIPIO DE VIDEIRA', 'FUNDO MUNICIPAL DE SAUDE'].map((o) => OBS.contratos.ehConsorcio({ orgao: o })),
    [true, true, false, false]);
  teste('servidores: aposentados e pensionistas contam como inativos',
    ['Aposentado', 'Pensionista do Tesouro', 'Aposentado (Complemento)', 'Estatutário', 'Cargo Comissionado'].map((v) => OBS.pessoal.ehInativo({ vinculo: v })),
    [true, true, true, false, false]);
  teste('contratos: filtro por órgão', OBS.contratos.buscar(K, { orgao: 'FUNDO' }, 'valorGlobal', 'dataAssinatura').length, 1);
  teste('fornecedores: soma pelo CNPJ', OBS.contratos.fornecedores(K).slice(0, 2).map((f) => [f.nome, f.contratos, f.soma]), [['ÁGUA LIMPA LTDA', 2, 400], ['BETA SA', 1, 250]]);
  teste('contar por campo', OBS.contratos.contar(K, 'orgao'), [['MUNICIPIO', 3], ['FUNDO', 1]]);
  teste('data em português', OBS.contratos.data('2025-12-10T09:00:00'), '10/12/2025');
  teste('URL usa barra pura nas datas', OBS.fontes.despesas.montarUrl('01/09/2026', '30/09/2026').includes('dataInicial=01/09/2026'), true);

  // ===================== FASE 5 =====================
  // ----- Utilitários novos -----
  teste('dataBR', [OBS.dataBR('2026-03-05T10:00'), OBS.dataBR('x')], ['05/03/2026', '']);
  teste('slug tira acento e símbolos', OBS.slug(' JOÃO  da Silva/ME '), 'joao-da-silva-me');
  teste('resumirTexto corta numa palavra', OBS.resumirTexto('aaaa bbbb cccc dddd', 12), 'aaaa bbbb…');
  teste('resumirTexto não mexe em texto curto', OBS.resumirTexto('curto', 12), 'curto');
  // ----- Fichas de servidor: endereço estável e sem duplicar -----
  const ids = OBS.pessoal.comIds([
    { nome: 'ANA', cargo: 'PROFESSOR', desde: '03/2021' }, { nome: 'ANA', cargo: 'PROFESSOR', desde: '03/2021' }, { nome: 'Bia', cargo: 'X' }]);
  teste('ficha: endereço vem de nome, cargo e admissão', ids[0].id, 'ana--professor--03-2021');
  teste('ficha: registro repetido ganha --2', ids.map((s) => s.id).sort(), ['ana--professor--03-2021', 'ana--professor--03-2021--2', 'bia--x']);
  const cmp = OBS.pessoal.comparacaoCargo([{ cargo: 'A', salario: 1 }, { cargo: 'A', salario: 5 }, { cargo: 'A', salario: 5 }, { cargo: 'B', salario: 9 }], { cargo: 'A', salario: 5 });
  teste('comparação só com o mesmo cargo', cmp, { total: 3, maiores: 0, menores: 1, iguais: 2 });
  teste('comparação sem salário', OBS.pessoal.comparacaoCargo([], { cargo: 'A', salario: null }), null);
  // ----- Fornecedor: chave da ficha -----
  teste('fornecedor com CNPJ: chave = 14 números', OBS.contratos.chaveFornecedor({ fornecedorDoc: '11.222.333/0001-44' }), '11222333000144');
  teste('fornecedor pessoa física: chave pelo nome, nunca o CPF inteiro', OBS.contratos.chaveFornecedor({ fornecedor: 'José', fornecedorDoc: '***.456.789-**' }), 'n-jose-456789');
  // ----- Transferências -----
  const TR = [{ ano: 2025, mes: 1, tipo: 'FPM', valor: 100 }, { ano: 2025, mes: 1, tipo: 'AJUSTE', valor: -10 }, { ano: 2025, mes: 3, tipo: 'FPM', valor: 50 },
    { ano: 2026, mes: 1, tipo: 'FPM', valor: 120 }, { ano: 2026, mes: 2, tipo: 'FUNDEB', valor: 30 }];
  teste('transferências: anos do mais recente', OBS.transferencias.anos(TR), [2026, 2025]);
  teste('transferências: mês sem dado fica null (não zero)', OBS.transferencias.porMes(TR, 2025).slice(0, 4), [90, null, 50, null]);
  teste('transferências: negativo entra na soma', OBS.transferencias.acumulado(TR, 2025, 12), 140);
  teste('transferências: comparação até o mesmo mês', [OBS.transferencias.acumulado(TR, 2026, 2), OBS.transferencias.acumulado(TR, 2025, 2)], [150, 90]);
  teste('transferências: por tipo, maior primeiro', OBS.transferencias.porTipo(TR, 2025).map((x) => x.tipo), ['FPM', 'AJUSTE']);
  teste('transferências: último mês', OBS.transferencias.ultimoMes(TR, 2026), 2);
  teste('transferências: variação', [OBS.transferencias.variacao(150, 100), OBS.transferencias.variacao(1, 0)], [50, null]);
  // ----- Despesa por área (DCA): nunca mistura etapas -----
  const DCA = { funcoes: [{ codigo: '10', nome: 'Saúde', valores: { empenhado: 100, pago: 90 } }, { codigo: '12', nome: 'Educação', valores: { empenhado: 300 } }] };
  teste('DCA: empenhado ordena e calcula a fatia', OBS.contas.funcoes(DCA, 'empenhado').map((f) => [f.nome, f.fatia]), [['Educação', 75], ['Saúde', 25]]);
  teste('DCA: etapa sem valor fica de fora (não vira zero)', OBS.contas.funcoes(DCA, 'pago').map((f) => [f.nome, f.valor, f.fatia]), [['Saúde', 90, 100]]);
  // ----- Educação (SIOPE) -----
  const IND = (codigo, nome, valor) => ({ codigo, nome, valor });
  teste('SIOPE: mínimo de 25% só no indicador 1.1 (MDE)', OBS.contas.minimoEducacao(IND('1.1', 'Percentual de aplicação das receitas de impostos e transferências vinculadas à educação em MDE (mínimo de 25% para estados, DF e municípios)', 28.08)),
    { minimo: 25, base: 'Constituição Federal, art. 212', cumpre: true });
  teste('SIOPE: mínimo de 70% só no indicador 1.2 (FUNDEB na remuneração)', OBS.contas.minimoEducacao(IND('1.2', 'Percentual de aplicação do FUNDEB na remuneração dos profissionais da educação (mínimo de 70%) - Inciso XXII', 84.95)).minimo, 70);
  teste('SIOPE: indicadores que só CITAM MDE não ganham mínimo (aposentadorias, pessoal, o máximo do 1.3...)', [
    IND('3.1', 'Percentual das despesas com aposentadorias e pensões da área educacional em relação às despesas totais com MDE', 0),
    IND('3.2', 'Percentual das despesas com pessoal e encargos sociais da área educacional em relação à despesa total com MDE', 0),
    IND('2.11', 'Percentual de despesas correntes em educação em relação à despesa total em MDE', 0),
    IND('1.3', 'Percentual de aplicação do FUNDEB em despesas com MDE, que não remuneração dos profissionais da educação (máximo de 30%)', 11.44),
    IND('8.1', 'Valor exigido de aplicação de impostos em MDE (Mínimo de 25%)', 65410131.76),
    IND('9.9', 'Percentual de aplicação das receitas de impostos e transferências vinculadas à educação em MDE', 20)
  ].map(OBS.contas.minimoEducacao), [null, null, null, null, null, null]);
  teste('SIOPE: "Valor exigido ... (Mínimo de 25%)" é dinheiro, não percentual', ['Valor exigido de aplicação de impostos em MDE (Mínimo de 25%)',
    'Superávit/Déficit do ente federado no exercício', 'Saldo financeiro do FUNDEB no exercício atual', 'Percentual das receitas do FUNDEB não aplicadas (máximo de 10%)']
    .map(OBS.contas.tipoIndicador), ['moeda', 'moeda', 'moeda', 'pct']);
  teste('SIOPE: só o 6º bimestre é ano fechado (antes disso não se compara com o mínimo)',
    [4, 6].map((b) => OBS.contas.anoFechado({ ano: 2026, bimestre: b })), [false, true]);
  teste('SIOPE: valor em reais não ganha mínimo percentual', OBS.contas.minimoEducacao({ nome: 'Valor aplicado em MDE (R$)', valor: 10 }), null);
  teste('SIOPE: tipo do indicador pelo nome', ['Percentual X', 'Investimento por aluno', 'Número de matrículas'].map(OBS.contas.tipoIndicador), ['pct', 'moeda', 'numero']);
  // ----- Entregas -----
  const EN = [{ instituicao: 'P', entregavel: 'RGF', data: '2026-01-30' }, { instituicao: 'P', entregavel: 'RGF', data: '2026-05-30' }, { instituicao: 'C', entregavel: 'RGF', data: '2026-02-01' }];
  teste('entregas: última de cada relatório', OBS.contas.ultimasEntregas(EN).map((r) => r.instituicao + r.data), ['P2026-05-30', 'C2026-02-01']);
  teste('entregas: rótulo do período', [OBS.contas.rotuloPeriodo({ periodicidade: 'Q', periodo: 2 }), OBS.contas.rotuloPeriodo({ periodicidade: 'A', periodo: 1 }), OBS.contas.rotuloPeriodo({ periodicidade: 'M', periodo: 3 })], ['2º quadrimestre', 'anual', 'março']);
  // ----- Gráficos -----

  const fnv = (texto) => { let h = 0x811c9dc5; for (let i = 0; i < texto.length; i++) { h ^= texto.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; } return h.toString(16).padStart(8, '0'); };
  teste('QR do Pix: versão, nível e máscara iguais aos da referência', [qrPix.versao, qrPix.nivel, qrPix.mascara, qrPix.tamanho], [8, 'M', 2, 49]);
  teste('QR do Pix: mesmos módulos da referência (impressão digital)', [escurosQr, fnv(linhasQr.join('|'))], [1220, '2eb6f035']);
  teste('QR: texto vazio e acentos viram bytes UTF-8 corretos', [OBS.qr.utf8(''), OBS.qr.utf8('ã€')], [[], [0xC3, 0xA3, 0xE2, 0x82, 0xAC]]);
