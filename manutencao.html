<!DOCTYPE html>
<!-- PÁGINA DE MANUTENÇÃO: quando existir o arquivo MANUTENCAO.ativa na raiz do repositório, o robô de publicação
     (.github/workflows/publicar.yml) coloca ESTA página no lugar do index.html. Para voltar ao normal, apague
     o arquivo MANUTENCAO.ativa. Sem JavaScript e sem estilo dentro do HTML (a política de segurança do site não deixa);
     o visual e a animação ficam em css/manutencao.css. -->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'none'; style-src 'self'; font-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Olho Mágico — Em manutenção</title>
<meta name="description" content="O Olho Mágico está em manutenção para melhorar a segurança e a qualidade dos dados. Voltamos em breve.">
<meta name="theme-color" content="#FAF8F5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16111D" media="(prefers-color-scheme: dark)">
<link rel="icon" href="img/favicon.svg" type="image/svg+xml">
<link rel="preload" href="css/tipografia/atkinson-hyperlegible-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/manutencao.css">
</head>
<body>
<main class="palco">
  <!-- LOGO: o mesmo do site (cacho de uvas com um olho mágico dourado). O olho pisca, só com CSS. -->
  <svg class="logo" viewBox="0 0 16 16" role="img" aria-label="Logo do Olho Mágico: um cacho de uvas com um olho dourado piscando">
    <g class="uva"><circle cx="8" cy="4.6" r="2.2"/><circle cx="12.2" cy="4.6" r="2.2"/><circle cx="5.9" cy="8.4" r="2.2"/><circle cx="10.1" cy="8.4" r="2.2"/><circle cx="8" cy="12.2" r="2.2"/></g>
    <g class="olho">
      <circle class="aro" cx="3.8" cy="4.6" r="2.6"/>
      <circle class="lente" cx="3.8" cy="4.6" r="1.2"/>
    </g>
  </svg>

  <h1>Estamos em manutenção</h1>
  <p class="texto">O Olho Mágico está em manutenção para melhorar a segurança e a qualidade dos dados. Voltamos em breve.</p>
  <p class="nota">Os dados oficiais continuam disponíveis nas fontes originais, como o <a href="https://videira.atende.net/transparencia/">Portal da Transparência de Videira</a>.</p>
  <p class="aviso">Portal independente. Não é site oficial da Prefeitura.</p>
</main>
</body>
</html>
